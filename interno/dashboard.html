 "T20", "tarea": "Definir entrenamientos preparatorios (fechas/formato)", "entregable": "Filtro deportivo", "resp": "Gus/Lili", "fecha": "2026-10-10", "estatus": "Pendiente", "prioridad": "Media", "notas": "Upsell para la marca"}], "raci": [{"item": "Protocolos de seguridad y botiquín", "gus": "A", "lili": "R", "monica": "I"}, {"item": "Validación y gestión de equipo técnico", "gus": "A", "lili": "R", "monica": "I"}, {"item": "Enlace técnico local (guía en Guatemala)", "gus": "R", "lili": "C", "monica": "C"}, {"item": "Inspección en terreno (alimentos, hidratación, porters)", "gus": "I", "lili": "R", "monica": "C"}, {"item": "Campañas publicitarias y pauta (IG, TikTok)", "gus": "R", "lili": "C", "monica": "I"}, {"item": "Identidad visual del viaje", "gus": "R", "lili": "C", "monica": "A"}, {"item": "Filtro deportivo de participantes", "gus": "R", "lili": "R", "monica": "I"}, {"item": "Entrenamientos preparatorios en México", "gus": "R", "lili": "R", "monica": "I"}, {"item": "Cotización y reservas hoteles/transporte terrestre", "gus": "I", "lili": "I", "monica": "R"}, {"item": "Gestión de vuelos (servicio opcional)", "gus": "I", "lili": "I", "monica": "R/A"}, {"item": "Validación visual de marketing/contenidos", "gus": "C", "lili": "C", "monica": "A"}, {"item": "Red de contactos y logística Guatemala", "gus": "C", "lili": "C", "monica": "R"}, {"item": "Estructura legal de la entidad", "gus": "A", "lili": "C", "monica": "C"}, {"item": "Simulador financiero integral", "gus": "A", "lili": "C", "monica": "R"}, {"item": "Definición de precios y cupos", "gus": "A", "lili": "C", "monica": "C"}, {"item": "Kit Informativo del Cliente", "gus": "C", "lili": "R", "monica": "C"}, {"item": "Kit Operativo Interno", "gus": "R", "lili": "R", "monica": "C"}, {"item": "Permisos/autorizaciones acceso a volcanes", "gus": "C", "lili": "C", "monica": "C"}], "risks": [{"id": "R1", "riesgo": "Mal de altura / lesión en ascenso", "cat": "Seguridad/Montaña", "p": 3, "i": 5, "mit": "Gus/Lili", "estatus": "Abierto"}, {"id": "R2", "riesgo": "Clima adverso en fecha de ascenso", "cat": "Operativo", "p": 3, "i": 4, "mit": "Guía local", "estatus": "Abierto"}, {"id": "R3", "riesgo": "No se alcanza el cupo mínimo (punto de equilibrio)", "cat": "Comercial", "p": 3, "i": 5, "mit": "Gus/Lili", "estatus": "Abierto"}, {"id": "R4", "riesgo": "Cliente compra vuelo fuera de ventana indicada", "cat": "Logístico", "p": 2, "i": 3, "mit": "Mónica", "estatus": "Abierto"}, {"id": "R5", "riesgo": "Porters/arrieros no disponibles o tarifa no validada", "cat": "Logístico", "p": 2, "i": 4, "mit": "Lili", "estatus": "Abierto"}, {"id": "R6", "riesgo": "Estructura legal de la entidad no lista para operar", "cat": "Legal/Administrativo", "p": 3, "i": 4, "mit": "Gus", "estatus": "Abierto"}, {"id": "R7", "riesgo": "Permisos de acceso a volcanes no gestionados a tiempo", "cat": "Legal/Permisos", "p": 2, "i": 5, "mit": "Sin definir", "estatus": "Abierto"}, {"id": "R8", "riesgo": "Tipo de cambio MXN/GTQ/USD afecta margen", "cat": "Financiero", "p": 2, "i": 3, "mit": "Mónica/Gus", "estatus": "Abierto"}, {"id": "R9", "riesgo": "Cliente no comprueba ascensos previos y evita el filtro", "cat": "Seguridad/Comercial", "p": 2, "i": 4, "mit": "Gus/Lili", "estatus": "Abierto"}, {"id": "R10", "riesgo": "Cancelaciones de último momento bajo punto de equilibrio", "cat": "Comercial", "p": 2, "i": 4, "mit": "Gus/Mónica", "estatus": "Abierto"}]};
const HOTELES = [
  {id:'a1',ciudad:'Antigua',nombre:'Soleil Antigua 4★',p11:2330,p18:2400},
  {id:'a2',ciudad:'Antigua',nombre:'La Capitanía de San Pedro 2★',p11:900,p18:1000},
  {id:'a3',ciudad:'Antigua',nombre:'La Posadita Alegre 3★',p11:1500,p18:1645},
  {id:'t1',ciudad:'Atitlán',nombre:'Porta del Lago 3★',p11:2330,p18:2540},
  {id:'t2',ciudad:'Atitlán',nombre:'San Buenaventura de Atitlán 3★',p11:2600,p18:2365},
  {id:'t3',ciudad:'Atitlán',nombre:'Hotel La Riviera',p11:1700,p18:1719}
];
const TEAM = ['Gus','Lili','Mónica'];
const STATUS = ['Pendiente','En progreso','Completado','Bloqueado'];
const SALIDAS = {'11 feb 2027':'2027-02-11','18 feb 2027':'2027-02-18'};
const DOCS = [

  {id:'gear',kit:'Cliente',nombre:'Lista de equipo obligatorio (gear checklist)',resp:'Lili',tarea:'T12'},

];

});

function load(){

  return DEFAULT();
}
function saveLocal(){ try{ localStorage.setItem('hmi-gt27', JSON.stringify(S)); }catch(e){} }
function save(){ saveLocal(); if(sync){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(push,800); setSync('saving'); } }
const $ = (s,r=document)=>r.querySelector(s);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mxn = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(n||0);
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const pd = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d); };
const daysTo = s => Math.round((pd(s)-today())/864e5);
const fmtD = s => s ? pd(s).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}) : '—';
const overdue = t => t.estatus!=='Completado' && t.fecha && pd(t.fecha) < today();

// ---------- costeo ----------
function calc(){
  const c=S.c, h=HOTELES;
  const hotelA = h.find(x=>x.id===c.hotelA), hotelT = h.find(x=>x.id===c.hotelT);
  const fijo = c.fijos.reduce((a,x)=>a+(+x.m||0),0);
  const guia = c.guiaUsd*c.tc;
  const hosp = hotelA ? c.noches*hotelA[c.fechaH]/2 : 0; // doble por noche → por persona
  const portersMx = c.porters*c.portersGtq*c.gtq;
  const varP = guia + hosp + (+c.alimentos||0) + (+c.transporte||0) + (+c.entradas||0) + portersMx;
  const margen = c.precio - varP;
  const com = c.comBase==='utilidad' ? Math.max(0,margen)*c.comPct/100 : c.precio*c.comPct/100;
  const contrib = margen - com;
  const be = contrib>0 ? Math.ceil(fijo/contrib) : null;
  const util = n => n*contrib - fijo;
  const extension = hotelT ? hotelT[c.fechaH]/2 : 0;
  return {fijo,guia,hosp,portersMx,varP,margen,com,contrib,be,util,extension,hotelA,hotelT};
}

// ---------- views ----------

  const cnt=e=>T.filter(t=>t.estatus===e).length;
  const col={Pendiente:'#c9c5b8','En progreso':'#f1b84b',Completado:'#2d8a42',Bloqueado:'#b3261e'};
  const prox=T.filter(t=>t.estatus!=='Completado').sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,7);
  const max=S.c.cupoMax, pts=[]; for(let n=2;n<=max;n+=2) pts.push([n,k.util(n)]);
  const mx=Math.max(1,...pts.map(p=>Math.abs(p[1]))), W=520,H=190,bw=W/pts.length;
  const svg = `<svg viewBox="0 0 ${W} ${H+28}" width="100%" role="img" aria-label="Utilidad neta por cupo">`+
    `<line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="#bbb"/>`+
    pts.map(([n,u],i)=>{const h=Math.abs(u)/mx*(H/2-14), y=u>=0?H/2-h:H/2;

  return `<h2>RIESGOS</h2><div class="card"><table>
  <tr><th>ID</th><th>Riesgo</th><th>Categoría</th><th>Prob. (1-5)</th><th>Impacto (1-5)</th><th>Puntaje</th><th>Mitigación / dueño</th><th>Estatus</th></tr>
  ${R.map(i=>{const r=S.risks[i],s=r.p*r.i;return `<tr><td>${esc(r.id)}</td><td>${esc(r.riesgo)}</td><td>${esc(r.cat)}</td>

    return `${H}Matriz de responsabilidades\nR responsable · A aprueba · C consultado · I informado\n\n| Entregable | Gus | Lili | Mónica |\n|---|---|---|---|\n`+SEED.raci.map(r=>`| ${r.item} | ${r.gus} | ${r.lili} | ${r.monica} |`).join('\n')+`\n\n## Pendientes por persona\n### Gus\n${byP('Gus')}\n### Lili\n${byP('Lili')}\n### Mónica\n${byP('Mónica')}\n### Sin asignar\n${byP('Sin asignar')}`},
  flujo:()=>`${H}Flujo de trabajo del cliente

1. Interés: llega por Instagram, TikTok o WhatsApp y llena el formulario de la landing.
2. Filtro: se valida que haya subido montañas en México. Si no, se le ofrece entrenamiento HMMX.
3. Reserva: confirmación de salida (11 o 18 feb), extensión y servicio de vuelos. Anticipo: ${f}
4. Pago del saldo: fecha límite ${f}
5. Kit informativo: itinerario, gear checklist, reglamento, hoteles y puntos de encuentro.
6. Seguimiento: recordatorios a 30, 14 y 3 días; confirmación de vuelos.
7. Viaje: día 0 staff, días 1–4 programa, día 5 extensión opcional.
8. Postviaje: fotos, reseña, encuesta y oferta de siguiente expedición.`,
  cron:()=>`${H}Cronograma de pendientes (${new Date().toLocaleDateString('es-MX')})

| ID | Tarea | Responsable | Fecha | Estatus | Prioridad |
|---|---|---|---|---|---|
`+[...S.tasks].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(t=>`| ${t.id} | ${t.tarea} | ${t.resp} | ${t.fecha} | ${t.estatus}${overdue(t)?' (vencida)':''} | ${t.prioridad} |`).join('\n'),
  fin:()=>`${H}Resumen financiero · Guatemala 2027 (MXN)

- Tipo de cambio: ${c.tc} MXN/USD · ${c.gtq} MXN/GTQ
- Precio de venta: ${mxn(c.precio)} por persona
- Costos fijos: ${mxn(k.fijo)}
${c.fijos.map(x=>`  - ${x.n}: ${mxn(x.m)}`).join('\n')}
- Costo variable por persona: ${mxn(k.varP)}
  - Guía + cabaña (USD ${c.guiaUsd}): ${mxn(k.guia)}
  - Hospedaje Antigua (${c.noches} noches): ${mxn(k.hosp)}
  - Alimentos ${mxn(c.alimentos)}, transporte ${mxn(c.transporte)}, entradas ${mxn(c.entradas)}
- Comisión Mónica: ${c.comPct}% sobre ${c.comBase} = ${mxn(k.com)} por persona
- **Punto de equilibrio: ${k.be??'sin equilibrio con estos parámetros'} personas**
- Utilidad con cupo mínimo (${c.cupoMin}): ${mxn(k.util(c.cupoMin))}
- Utilidad con cupo máximo (${c.cupoMax}): ${mxn(k.util(c.cupoMax))}

Cifras estimadas pendientes de validar con el cruce de archivos de costeo.`
  };
  return out[id]();
}
function download(name,text,type='text/markdown'){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}


// ---------- sincronización con Google Sheets (Apps Script) ----------
const SYNC_KEY='hmi-gt27-sync';
let sync=null, dirty=false, saveTimer=null, pushing=false;
try{ sync=JSON.parse(localStorage.getItem(SYNC_KEY)); }catch(e){}
function saveSyncCfg(){ try{ if(sync) localStorage.setItem(SYNC_KEY,JSON.stringify(sync)); else localStorage.removeItem(SYNC_KEY); }catch(e){} }
function setSync(state,msg){
  const el=$('#sync-status'), b=$('#btn-sync'); if(!el) return;
  const hora=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const txt={local:'Solo en este navegador',saving:'Guardando…',ok:'Hoja sincronizada '+hora,error:msg||'Sin conexión con la hoja',conflict:msg||'Se cargó una versión más reciente'}[sync?state:'local'];
  el.className='sync '+(sync?state:'local'); el.innerHTML='<i></i>'+esc(txt);
  b.textContent=sync?'Hoja conectada':'Conectar Google Sheet';
}
async function api(method,body){
  const url=method==='GET'?sync.url+(sync.url.includes('?')?'&':'?')+'token='+encodeURIComponent(sync.token):sync.url;
  const opt=method==='GET'?{}:{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:sync.token},body))};
  const r=await fetch(url,opt); return r.json();
}
function adopt(res){
  const d=DEFAULT();
  S={tasks:res.state.tasks||[],risks:res.state.risks||[],inscritos:res.state.inscritos||[],docs:res.state.docs||{},c:Object.assign({},d.c,res.state.c||{})};
  if(!Array.isArray(S.c.fijos)) S.c.fijos=d.c.fijos;
  sync.version=res.version; saveSyncCfg(); saveLocal(); dirty=false; render();
}
const editing=()=>{ const a=document.activeElement; return a && /INPUT|SELECT|TEXTAREA/.test(a.tagName); };
async function push(){
  if(!sync||pushing) return; pushing=true;
  try{
    const res=await api('POST',{baseVersion:sync.version,by:'tablero',state:{tasks:S.tasks,risks:S.risks,inscritos:S.inscritos,docs:S.docs,c:S.c}});
    if(res.conflict){ adopt(res); setSync('conflict','Otra persona guardó antes: se cargó su versión. Repite tu cambio.'); }
    else if(res.ok){ sync.version=res.version; saveSyncCfg(); dirty=false; setSync('ok'); }
    else setSync('error',res.error==='token'?'Clave incorrecta':'La hoja rechazó el guardado');
  }catch(e){ setSync('error'); }
  pushing=false;
}
async function pull(){
  if(!sync) return;
  try{
    const res=await api('GET');
    if(!res.ok){ setSync('error',res.error==='token'?'Clave incorrecta':'Error de la hoja'); return; }
    if(res.state===null){ dirty=true; await push(); return; }       // hoja nueva: se llena con lo local
    if(res.version!==sync.version){ adopt(res); }
    setSync('ok');
  }catch(e){ setSync('error'); }
}
async function connect(){
  if(sync){ if(confirm('Se está sincronizando con Google Sheets. ¿Desconectar? (los datos quedan en la hoja y en este navegador)')){ sync=null; saveSyncCfg(); setSync('local'); } return; }
  const url=prompt('Pega la URL de la aplicación web (termina en /exec):'); if(!url) return;
  const token=prompt('Pega la clave (TOKEN) que pusiste en el script:'); if(!token) return;
  sync={url:url.trim(),token:token.trim(),version:-1};
  try{
    const res=await api('GET');
    if(!res.ok) throw new Error(res.error||'error');
    if(res.state===null){ sync.version=res.version; saveSyncCfg(); dirty=true; await push(); alert('Hoja conectada. Se subieron los datos actuales del tablero.'); }
    else if(confirm('La hoja ya tiene datos. Aceptar = cargar los de la hoja y reemplazar lo que ves aquí. Cancelar = no conectar.')){ adopt(res); setSync('ok'); }
    else { sync=null; setSync('local'); }
  }catch(e){ alert('No se pudo conectar. Revisa la URL, la clave y que el acceso de la aplicación web sea "Cualquier persona".'); sync=null; setSync('local'); }
}
setInterval(()=>{ if(!sync||document.visibilityState!=='visible'||editing()) return; if(dirty) push(); else pull(); },45000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&sync&&!dirty&&!editing()) pull(); });

// ---------- events ----------
function setPath(path,val){
  const p=path.split('.'); let o=S; for(let i=0;i<p.length-1;i++) o=o[p[i]];
  const last=p[p.length-1], cur=o[last];
  o[last] = typeof cur==='number' ? (parseFloat(val)||0) : val;
}
function afterRender(){}
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); return; }
  if(b.id==='add-task'){ const n=S.tasks.length+1; S.tasks.push({id:'T'+String(n).padStart(2,'0'),tarea:'Nueva tarea',entregable:'',resp:'Sin asignar',fecha:new Date(Date.now()+7*864e5).toISOString().slice(0,10),estatus:'Pendiente',prioridad:'Media',notas:''}); }
  else if(b.dataset.delTask!==undefined){ if(!confirm('¿Eliminar esta tarea?')) return; S.tasks.splice(+b.dataset.delTask,1); }
  else if(b.id==='add-fijo') S.c.fijos.push({n:'Nuevo costo',m:0});
  else if(b.dataset.delFijo!==undefined) S.c.fijos.splice(+b.dataset.delFijo,1);
  else if(b.dataset.pick){ const h=HOTELES.find(x=>x.id===b.dataset.pick); S.c[h.ciudad==='Antigua'?'hotelA':'hotelT']=h.id; }
  else if(b.id==='add-ins') S.inscritos.push({nombre:'',contacto:'',salida:'11 feb 2027',ascensos:'Sí',ext:'No',vuelos:'No',pago:'Pendiente',precio:S.c.precio,pagado:0});
  else if(b.dataset.delIns!==undefined){ if(!confirm('¿Eliminar este participante?')) return; S.inscritos.splice(+b.dataset.delIns,1); }
  else if(b.dataset.gen){ const d=DOCS.find(x=>x.id===b.dataset.gen); download(`HMI_${d.id}_borrador.md`,docText(d.id)); if(!S.docs[d.id]||S.docs[d.id]==='Pendiente') S.docs[d.id]='Borrador'; }
  else if(b.id==='btn-sync'){ connect(); return; }
  else if(b.id==='btn-export'){ download('hmi-guatemala-2027-respaldo.json',JSON.stringify(S,null,2),'application/json'); return; }
  else if(b.id==='btn-import'){ $('#file-import').click(); return; }
  else if(b.id==='btn-reset'){ if(!confirm(sync?'Esto vuelve a los datos del Excel y SOBRESCRIBE la Google Sheet para todo el equipo. ¿Continuar?':'Esto borra tus cambios y vuelve a los datos del Excel. ¿Continuar?')) return; S=DEFAULT(); }
  else return;
  save(); render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-resp'){ filtro.resp=t.value; render(); return; }
  if(t.id==='f-est'){ filtro.est=t.value; render(); return; }
  if(t.id==='file-import'){
    const f=t.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!j.c||!j.tasks) throw 0; S=j; save(); render(); }catch(_){ alert('El archivo no es un respaldo válido.'); } };
    r.readAsText(f); t.value=''; return;
  }
  if(t.dataset.doc){ S.docs[t.dataset.doc]=t.value; save(); render(); return; }
  if(t.dataset.p){ setPath(t.dataset.p,t.value); save(); render(); }
});
render();
setSync(sync?'saving':'local'); if(sync) pull();
</script>
